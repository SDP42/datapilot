[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot"
version = "0.0.0"
description = "DataPilot — Autonomous AI Data Science Platform (deterministic data engine, Phases 0-7)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Swayam Panchal", email = "panchalswayam35@gmail.com" }]
keywords = ["data-science", "automl", "mlops", "llm", "autonomous-agent"]

# Phase 0 keeps runtime dependencies deliberately minimal.
# Engine-specific stacks are added in the phase that first needs them —
# see docs/roadmap.md. scikit-learn was added in Phase 7.4 (the first
# phase that fits estimators). xgboost / lightgbm / shap / mlflow /
# fastapi / sqlalchemy / duckdb ... remain deliberately unadded. torch is
# Phase 8's optional 'dl' extra (below) — every Phase 0-7 capability,
# including the classical data_engine.modeling path, works without it.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Phase 4 visualization foundation — in-memory chart rendering.
    # Matplotlib and Plotly are both rendering backends for the same
    # deterministic VisualizationSpec (no dashboard / API layer).
    "matplotlib>=3.8",
    "plotly>=5.0",
    # Phase 7.4 model training & evaluation — the modeling phase is the
    # first that fits estimators and computes evaluation metrics. Only
    # scikit-learn's dependency-light baseline estimators are used; no
    # XGBoost / LightGBM / Optuna / MLflow / deep-learning stack is added.
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Type stubs for runtime dependencies that ship their own (pandas,
    # pyyaml) — scipy / scikit-learn / plotly do not publish actively
    # maintained stubs, so those are handled via [tool.mypy] overrides
    # below instead of a speculative stub package.
    "pandas-stubs",
    "types-PyYAML",
]
# Optional: static image export (PNG / SVG / PDF) of Plotly figures via
# export_visualization(). HTML export needs nothing extra.
export = [
    "kaleido",
]
# Phase 8 — deep learning (dl_engine). Optional: dl_engine.availability
# detects its absence deterministically, and every Phase 0-7 capability
# (including the classical scikit-learn modeling path) is fully usable
# without installing it.
dl = [
    "torch>=2.2",
]
# Phase 9.4 — MLflow experiment logging (experimentation.mlflow_integration).
# Optional: experimentation.availability detects its absence
# deterministically, and every other Phase 9 capability (ExperimentRecord,
# capture_environment, record_experiment, ExperimentStore,
# compare_experiments) is fully usable without installing it.
mlflow = [
    "mlflow>=2.10",
]
# Phase 10.3 — SHAP-based feature importance (explainability.shap_integration).
# Optional: explainability.availability detects its absence
# deterministically, and every other Phase 10 capability (permutation
# importance, partial dependence) is fully usable without installing it.
explain = [
    "shap>=0.44",
]

[project.urls]
Documentation = "https://github.com/your-org/datapilot/tree/main/docs"

[tool.setuptools]
packages = [
    "datapilot",
    "ai_engine",
    "ai_engine.providers",
    "backend",
    "backend.datapilot_api",
    "data_engine",
    "data_engine.ingestion",
    "data_engine.profiling",
    "data_engine.quality",
    "data_engine.quality.checks",
    "data_engine.cleaning",
    "data_engine.cleaning.rules",
    "data_engine.cleaning.executors",
    "data_engine.preprocessing",
    "data_engine.validation",
    "data_engine.eda",
    "data_engine.problem_understanding",
    "data_engine.feature_engineering",
    "data_engine.modeling",
    "database",
    "dl_engine",
    "experimentation",
    "explainability",
    "ml_engine",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# scipy / scikit-learn / plotly do not publish actively maintained type
# stubs (unlike pandas / pyyaml, covered by the pandas-stubs / types-PyYAML
# dev dependencies above) — ignore_missing_imports here, scoped to exactly
# these three, rather than a blanket project-wide setting that would also
# hide a genuinely missing stub for a future dependency.
[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "plotly.*"]
ignore_missing_imports = true
